services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: withinu
      POSTGRES_USER: withinu
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-withinu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U withinu -d withinu"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/withinu}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-withinu}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-withinu}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-withinU-dev-only-secret-change-me-in-production-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CAMPUS_BOUNDARY_WKT: ${CAMPUS_BOUNDARY_WKT:-}
      ALLOW_ANY_LOCATION: ${ALLOW_ANY_LOCATION:-false}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  redisdata: