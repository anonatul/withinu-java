spring:
  application:
    name: withinu-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/withinu}
    username: ${DATABASE_USERNAME:withinu}
    password: ${DATABASE_PASSWORD:withinu}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null

withinu:
  jwt:
    secret: ${JWT_SECRET:withinU-dev-only-secret-change-me-in-production-0123456789}
    user-token-ttl: 7d
    admin-token-ttl: 12h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ratelimit:
    user-messages-per-minute: 10
    ip-requests-per-minute: 60
  geo:
    verification-cache-ttl: 5m
    campus-boundary-wkt: ${CAMPUS_BOUNDARY_WKT:}
    allow-any-location: ${ALLOW_ANY_LOCATION:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: warn