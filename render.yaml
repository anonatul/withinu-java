services:
  # Managed Redis (Render Key Value) — internal-only, no auth/TLS needed
  - type: keyvalue
    name: withinu-redis
    plan: free
    ipAllowList: []

  # Spring Boot API
  - type: web
    name: withinu-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        value: jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_USERNAME
        value: postgres.buhaxhcimrjgcudyymcw
      - key: DATABASE_PASSWORD
        sync: false # prompt: Supabase DB password
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: withinu-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://withinu-frontend.onrender.com
      - key: CAMPUS_BOUNDARY_WKT
        value: ""
      - key: ALLOW_ANY_LOCATION
        value: "true" # dev demo: set to false to enforce the TCET boundary

  # React app served by nginx, proxies /api to the backend
  - type: web
    name: withinu-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        value: https://withinu-backend.onrender.com