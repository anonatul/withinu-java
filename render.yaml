services:
  # Spring Boot API
  - type: web
    name: withinu-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        value: jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres # transaction pooler (5432 is session mode, max 15 clients)
      - key: DATABASE_USERNAME
        value: postgres.buhaxhcimrjgcudyymcw
      - key: DATABASE_PASSWORD
        sync: false # prompt: Supabase DB password
      - key: DB_POOL_MAX
        value: "2" # Supabase pooler allows ~15 clients; 2 is plenty for this app
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false # prompt: internal URL of your existing Render Key Value instance (redis://red-xxxx:6379)
      - key: CORS_ALLOWED_ORIGINS
        value: https://withinu-frontend.onrender.com
      - key: CAMPUS_BOUNDARY_WKT
        value: ""
      - key: ALLOW_ANY_LOCATION
        value: "false" # enforce the TCET campus boundary

  # React app served by nginx, proxies /api to the backend
  - type: web
    name: withinu-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_URL
        value: https://withinu-backend.onrender.com